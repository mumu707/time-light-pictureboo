<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#242921">
  <title>Can-mie-rua 立体书</title>
  <link rel="stylesheet" href="/camera/camera.css">
  <link rel="stylesheet" href="/game/book.css">
  <link rel="stylesheet" href="/camera/phone-preview.css">
  <script defer src="/js/native-bridge.js"></script>
  <script defer src="/js/cloud-recognition.js"></script>
  <script defer src="/js/ui-select.js"></script>
  <script defer src="/camera/album-store.js"></script>
  <script defer src="/game/settings.js"></script>
  <script type="module" src="/game/book.mjs"></script>
</head>
<body class="game-body phone-preview">
  <main class="book-shell phone-screen" data-world="study" data-open="false">
    <header class="book-header">
      <a class="game-tile" id="return-to-collection" href="/camera/#album/collection/stickers"><span aria-hidden="true">↶</span>收藏册</a>
      <h1>Can-mie-rua 立体书</h1>
      <button class="game-tile" id="open-game-settings" type="button" aria-haspopup="dialog"><span aria-hidden="true">⚙</span>设置</button>
    </header>

    <section class="book-stage" id="book-stage" aria-label="立体书场景">
      <div class="fallback-scene" aria-hidden="true">
        <div class="flat-cover"><span>☀</span>Can-mie-rua 立体书</div>
        <div class="flat-spread" id="desk-paper">
          <div class="flat-set"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="flat-mount"></div>
        </div>
      </div>
      <div class="scene-targets" id="scene-targets"></div>
      <button class="cover-button" id="open-book" type="button" aria-label="打开立体书"><span>打开立体书</span></button>
      <div id="reaction-note" class="reaction-note" role="status" hidden></div>
      <div id="ambient-bubble" class="ambient-bubble sr-only" role="status" aria-live="polite" hidden></div>
      <div id="book-trash-zone" class="sticker-trash-zone" hidden aria-hidden="true"><span>🗑 拖到此处删除</span></div>
      <div id="spirit-hud" class="spirit-hud" role="region" aria-labelledby="spirit-name" data-mode="inspect" hidden>
        <div id="spirit-speech-bubble" class="spirit-speech-bubble" aria-live="polite" hidden>
          <p id="chat-meta" class="chat-meta"></p>
          <div id="chat-bubble" class="chat-bubble-inline"></div>
        </div>
        <aside id="spirit-wing-left" class="spirit-wing spirit-wing-left">
          <header class="spirit-hud-head">
            <img id="spirit-thumb" class="spirit-thumb" alt="" hidden>
            <div class="spirit-hud-title">
              <h2 id="spirit-name"></h2>
              <p id="spirit-trait-badge" class="chat-meta"></p>
            </div>
          </header>
          <div id="spirit-card-stats" class="spirit-card"></div>
        </aside>
        <aside id="spirit-wing-right" class="spirit-wing spirit-wing-right">
          <div class="spirit-wing-actions">
            <button class="desk-pill desk-close spirit-hud-close" id="close-spirit-hud" type="button" aria-label="关闭精灵卡">×</button>
          </div>
          <div id="spirit-card" class="spirit-card"></div>
          <div id="spirit-chat-panel" class="spirit-chat-panel" hidden>
            <div id="chat-options" class="chat-options" role="group" aria-label="对话选项"></div>
          </div>
        </aside>
      </div>
    </section>

    <aside id="furniture-panel" class="furniture-panel" aria-label="场景家具列表" hidden>
      <header class="furniture-panel-head">
        <strong>场景家具</strong>
        <span id="furniture-count" class="furniture-count"></span>
        <button class="desk-pill desk-close" id="close-furniture-panel" type="button" aria-label="关闭家具列表">×</button>
      </header>
      <div id="furniture-items" class="furniture-items" role="list"></div>
    </aside>

    <footer class="book-footer">
      <div id="page-tools" hidden>
        <div class="book-dock">
          <button class="game-tile" id="open-tasks" type="button" aria-haspopup="dialog"><span aria-hidden="true">▤</span>任务</button>
          <button class="chapter-label" id="chapter-label" type="button" aria-label="打开章节目录"><span id="chapter-symbol" aria-hidden="true">☀</span><strong id="chapter-name"></strong></button>
          <button class="game-tile" id="desk-add" type="button" aria-haspopup="dialog"><span aria-hidden="true">✿</span>添加贴纸</button>
          <button class="game-tile" id="wake-spirit" type="button" aria-haspopup="dialog"><span aria-hidden="true">✦</span>唤醒精灵</button>
        </div>
        <div id="desk-selection" class="piece-inspector" hidden>
          <label for="desk-size">大小</label>
          <input id="desk-size" type="range" min="12" max="180" step="1">
          <select id="piece-surface" aria-label="贴纸位置"><option value="paper">贴在纸页</option><option value="prop">贴在布景</option></select>
          <select id="piece-face" aria-label="表情"><option value="none">无表情</option><option value="smile">微笑</option><option value="surprise">惊讶</option><option value="angry">生气</option></select>
          <button class="desk-pill" id="desk-remove" type="button">移除</button>
          <label class="piece-rotation" for="desk-rotation">旋转
            <input id="desk-rotation" type="range" min="-180" max="180" step="5" value="0">
          </label>
          <button class="desk-pill" id="finish-placement" type="button">完成</button>
          <label class="piece-self-rotation" for="desk-self-rotation">自身角度
            <input id="desk-self-rotation" type="range" min="-180" max="180" step="5" value="0">
          </label>
        </div>
        <nav class="scene-navigation" aria-label="书页与视角">
          <button class="page-arrow" id="prev-page" type="button" aria-label="上一页">‹</button>
          <div class="scene-actions">
            <button class="desk-pill" id="play-ecology" type="button" hidden></button>
            <button class="desk-pill" id="toggle-furniture-list" type="button" aria-expanded="false">家具清单</button>
            <button class="desk-pill" id="reset-view" type="button">重置视角</button>
          </div>
          <button class="page-arrow" id="next-page" type="button" aria-label="下一页">›</button>
        </nav>
      </div>
      <p id="desk-status" role="status"></p>
      <button class="desk-pill" id="desk-retry" type="button" hidden>重试保存</button>
    </footer>
  </main>

  <dialog class="desk-dialog desk-drawer" id="desk-drawer" aria-labelledby="desk-drawer-title">
    <header>
      <h2 id="desk-drawer-title"></h2>
      <button class="desk-pill desk-close" id="desk-drawer-close" type="button" aria-label="关闭贴纸抽屉" autofocus>×</button>
    </header>
    <div id="desk-library" class="desk-library"></div>
  </dialog>

  <dialog class="desk-dialog" id="chapter-dialog" aria-labelledby="chapter-title">
    <header><h2 id="chapter-title">章节目录</h2><button class="desk-pill desk-close" type="button" aria-label="关闭章节目录" autofocus>×</button></header>
    <p id="chapter-progress" aria-live="polite"></p>
    <div id="chapter-list" class="chapter-list"></div>
  </dialog>
  <dialog class="desk-dialog" id="task-dialog" aria-labelledby="task-title">
    <header><h2 id="task-title">任务</h2><button class="desk-pill desk-close" type="button" aria-label="关闭任务" autofocus>×</button></header>
    <p id="task-progress"></p>
    <div id="task-list" class="chapter-list"></div>
  </dialog>
  <dialog class="desk-dialog" id="ecology-game" aria-labelledby="ecology-title">
    <header><h2 id="ecology-title"></h2><button class="desk-pill desk-close" type="button" aria-label="关闭小游戏">×</button></header>
    <div id="ecology-board"></div>
  </dialog>

  <dialog class="desk-dialog game-settings" id="game-settings" aria-labelledby="game-settings-title">
    <header>
      <h2 id="game-settings-title">游戏设置</h2>
      <button class="desk-pill desk-close" id="close-game-settings" type="button" autofocus aria-label="关闭设置">×</button>
    </header>
    <form id="recognition-settings-form">
      <p>DeepSeek (dsv4.1flash) · 图鉴识别</p>
      <label for="deepseek-key">DeepSeek API Key</label>
      <input id="deepseek-key" type="password" maxlength="512" autocomplete="new-password" spellcheck="false" required>
      <p id="recognition-settings-status" role="status"></p>
      <div class="game-settings-actions">
        <button class="desk-pill desk-primary" type="submit">保存配置</button>
        <button class="desk-pill" id="clear-deepseek-key" type="button" hidden>清除已保存的 Key</button>
      </div>
    </form>
  </dialog>
</body>
</html>
